<svg width="310" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#e52e71"/>
    </linearGradient>
  </defs>

  <style>
    .fade-letter {
      fill: url(#gradText);
      opacity: 0;
      font-family: Arial, sans-serif;
      font-size: 28px;
      font-weight: bold;
      animation: fadeIn 0.6s ease-out forwards;
    }

    .l1 { animation-delay: 0.2s; }
    .l2 { animation-delay: 0.4s; }
    .l3 { animation-delay: 0.6s; }
    .l4 { animation-delay: 0.8s; }
    .l5 { animation-delay: 1s; }

    .draw-tile {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawTile 1s ease-out forwards;
    }

    .draw-letter {
      opacity: 0;
      animation: fadeIn 0.6s ease-out forwards;
    }

    .tile1 { animation-delay: 1.6s; }
    .tile2 { animation-delay: 1.8s; }
    .tile3 { animation-delay: 2s; }
    .tile4 { animation-delay: 2.2s; }

    .letter1 { animation-delay: 2.4s; }
    .letter2 { animation-delay: 2.6s; }
    .letter3 { animation-delay: 2.8s; }
    .letter4 { animation-delay: 3s; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes drawTile {
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- GUESS -->
  <text x="20" y="50" class="fade-letter l1">G</text>
  <text x="45" y="50" class="fade-letter l2">U</text>
  <text x="70" y="50" class="fade-letter l3">E</text>
  <text x="95" y="50" class="fade-letter l4">S</text>
  <text x="120" y="50" class="fade-letter l5">S</text>

  <!-- Tile: W -->
  <g>
    <rect x="160" y="22" width="24" height="36" rx="6" ry="6"
          fill="#2a2a2a" stroke="#555" stroke-width="1.5"
          class="draw-tile tile1"/>
    <text x="166" y="48" font-family="Arial, sans-serif"
          font-size="20" fill="#ffffff" font-weight="bold"
          class="draw-letter letter1">W</text>
  </g>

  <!-- Tile: O -->
  <g>
    <rect x="190" y="22" width="24" height="36" rx="6" ry="6"
          fill="#2a2a2a" stroke="#555" stroke-width="1.5"
          class="draw-tile tile2"/>
    <text x="196" y="48" font-family="Arial, sans-serif"
          font-size="20" fill="#ffffff" font-weight="bold"
          class="draw-letter letter2">O</text>
  </g>

  <!-- Tile: R (new one!) -->
  <g>
    <rect x="220" y="22" width="24" height="36" rx="6" ry="6"
          fill="#2a2a2a" stroke="#555" stroke-width="1.5"
          class="draw-tile tile3"/>
    <text x="226" y="48" font-family="Arial, sans-serif"
          font-size="20" fill="#ffffff" font-weight="bold"
          class="draw-letter letter3">R</text>
  </g>

  <!-- Tile: ? -->
  <g>
    <rect x="250" y="22" width="24" height="36" rx="6" ry="6"
          fill="#2a2a2a" stroke="#555" stroke-width="1.5"
          class="draw-tile tile4"/>
    <text x="256" y="48" font-family="Arial, sans-serif"
          font-size="20" fill="#ffffff" font-weight="bold"
          class="draw-letter letter4">?</text>
  </g>
</svg>
