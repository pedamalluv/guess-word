<i class="bi bi-joystick" (click)="openModal()"></i>
<app-modal [showModal]="isModalVisible" [title]="''" [showFooter]="true" (closeModal)="closeModal()">

    <div class="container">
        <div>
            <h2 class="text-center mb-3">🕹️ Choose Your Game Settings</h2>
            <!-- Word Size Selection -->
            <div class="mb-4 text-center">
                <label class="form-label fw-bold">🎯 Pick Word Size</label>
                <div class="btn-group d-block" role="group">
                    <input type="radio" class="btn-check" name="wordSize" id="size3" [(ngModel)]="wordSize" value="3">
                    <label class="btn btn-outline-warning funky-btn" for="size3">3 Letters</label>

                    <input type="radio" class="btn-check" name="wordSize" id="size4" [(ngModel)]="wordSize" value="4">
                    <label class="btn btn-outline-primary funky-btn" for="size4">4 Letters</label>

                    <input type="radio" class="btn-check" name="wordSize" id="size5" [(ngModel)]="wordSize" value="5">
                    <label class="btn btn-outline-success funky-btn" for="size5">5 Letters</label>
                </div>
            </div>

            <!-- Difficulty Level Selection -->
            <div class="mb-4 text-center">
                <label class="form-label fw-bold">⚡ Choose Difficulty</label>
                <select class="form-select funky-select w-auto mx-auto" [(ngModel)]="difficulty">
              <option value="easy">😎 Easy</option>
              <option value="moderate">🤔 Moderate</option>
              <option value="difficult">💀 Difficult</option>
            </select>
            </div>
        </div>
    </div>
    <div modal-footer>
        <!-- Submit Button -->
        <div class="text-center">
            <button class="btn btn-lg funky-submit" (click)="submitSelection()">🔥 Let’s Go!</button>
        </div>
    </div>
</app-modal>
